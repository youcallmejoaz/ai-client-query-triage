[project]
name = "ai-client-query-triage"
version = "0.1.0"
description = "Triage a shared client inbox with Gemini: classify, look up context, and save cited draft replies for a person to send."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "apscheduler>=3.11,<4",
  "fastapi>=0.120",
  "google-api-python-client>=2.150",
  "google-auth>=2.35",
  "google-auth-oauthlib>=1.2",
  "google-genai>=2.25,<3",
  "httpx>=0.28",
  "jinja2>=3.1",
  "msal>=1.31",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.20",
  "pyyaml>=6.0",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13",
  "playwright>=1.49",
  "pytest>=8.3",
  "ruff>=0.8",
  "types-PyYAML>=6.0",
]

[project.scripts]
triage = "triage.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.pycodestyle]
# The formatter wraps code at 110; long strings and comments may run a little longer.
max-line-length = 125

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["triage"]

[[tool.mypy.overrides]]
module = ["googleapiclient.*", "google_auth_oauthlib.*", "google.oauth2.*", "msal", "apscheduler.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# google-auth ships partial type hints; its constructors are untyped.
module = ["triage.mail.gmail"]
disallow_untyped_calls = false
